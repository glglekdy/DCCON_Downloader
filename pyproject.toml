[project]
name = "dccon-downloader"
version = "1.2.4"
description = "디시콘 다운로더 - 검색, 미리보기, 일괄 다운로드"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
]

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
dccon-downloader = "dccon.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dccon"]
