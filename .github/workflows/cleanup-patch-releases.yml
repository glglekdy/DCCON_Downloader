name: 패치 릴리즈 정리

# X.Y.0 은 영구 보존하고, X.Y.Z (Z > 0) 패치 릴리즈는 다음 릴리즈가 나오면 지운다.
# 릴리즈만 지우고 git 태그는 남긴다 — 그 시점 코드로 돌아갈 길은 열어둔다.
# 태그까지 지우려면 아래 gh release delete 에 --cleanup-tag 를 붙이면 된다.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 이전 패치 릴리즈 삭제
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          latest=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          echo "이번 릴리즈: ${KEEP:-(수동 실행)}"
          echo "최신 릴리즈: $latest"
          echo

          gh release list --repo "$REPO" --limit 200 --json tagName --jq '.[].tagName' > tags.txt

          deleted=0
          while read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            # 방금 올린 것과 최신 릴리즈는 무슨 일이 있어도 건드리지 않는다.
            if [ "$tag" = "${KEEP:-}" ] || [ "$tag" = "$latest" ]; then
              echo "보존(최신): $tag"
              continue
            fi
            # vX.Y.Z 에서 Z 를 뽑는다. 형식이 다르면 빈 값이 나와 건너뛴다.
            patch=$(printf '%s' "$tag" \
              | sed -n 's/^v\{0,1\}[0-9]\{1,\}\.[0-9]\{1,\}\.\([0-9]\{1,\}\)$/\1/p')
            if [ -n "$patch" ] && [ "$patch" -ne 0 ]; then
              echo "삭제(패치): $tag"
              gh release delete "$tag" --repo "$REPO" --yes
              deleted=$((deleted + 1))
            else
              echo "보존: $tag"
            fi
          done < tags.txt

          echo
          echo "지운 패치 릴리즈: ${deleted}개"
