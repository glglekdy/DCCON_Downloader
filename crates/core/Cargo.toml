[package]
name = "dccon-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
bytes = "1"
rand = "0.9"
sha1 = "0.10"
hex = "0.4"
percent-encoding = "2"
html-escape = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
